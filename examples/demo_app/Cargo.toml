[package]
name = "demo_app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
egui_agent = { path = "../../egui_agent", features = ["uds", "pipe", "stdio", "accesskit-introspection", "screenshot", "glow"] }
egui_agent_macros = { path = "../../egui_agent_macros" }
eframe = { workspace = true, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger = "0.11"

[dev-dependencies]
egui_agent = { path = "../../egui_agent", features = ["uds", "test-harness"] }
